
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEM Cyber | Secure Login</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg: #05070d;
        --card: rgba(12, 17, 29, 0.88);
        --border: rgba(120, 140, 180, 0.18);
        --text: #f4f7fb;
        --muted: #7f8aa3;
        --accent: #6c63ff;
        --accent2: #00d9ff;
        --danger: #ff5577;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 15% 20%, rgba(108, 99, 255, .18), transparent 30%),
            radial-gradient(circle at 85% 80%, rgba(0, 217, 255, .12), transparent 30%),
            var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Animated background */

    .grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .25;
        background-image:
            linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
        background-size: 50px 50px;
        transform: perspective(500px) rotateX(55deg) scale(1.5);
        transform-origin: center bottom;
    }

    .orb {
        position: fixed;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        filter: blur(90px);
        opacity: .15;
        animation: float 8s ease-in-out infinite;
        pointer-events: none;
    }

    .orb.one {
        background: var(--accent);
        top: -120px;
        left: -100px;
    }

    .orb.two {
        background: var(--accent2);
        right: -100px;
        bottom: -130px;
        animation-delay: -4s;
    }

    @keyframes float {
        0%, 100% {
            transform: translate(0, 0);
        }
        50% {
            transform: translate(35px, -25px);
        }
    }

    /* Main container */

    .login-wrapper {
        width: min(430px, calc(100% - 30px));
        position: relative;
        z-index: 5;
    }

    .login-card {
        padding: 42px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--card);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow:
            0 30px 80px rgba(0,0,0,.55),
            inset 0 1px rgba(255,255,255,.04);
        animation: appear .7s ease forwards;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(25px) scale(.97);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Brand */

    .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 32px;
    }

    .brand-icon {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -1px;
        color: white;
        background:
            linear-gradient(135deg, var(--accent), var(--accent2));
        box-shadow:
            0 10px 30px rgba(108,99,255,.28);
    }

    .brand-name {
        font-size: 18px;
        font-weight: 750;
    }

    .brand-sub {
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    h1 {
        font-size: 31px;
        letter-spacing: -1px;
        margin-bottom: 8px;
    }

    .description {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    /* Form */

    .field {
        margin-bottom: 20px;
    }

    .field-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 9px;
    }

    label {
        color: #cdd4e2;
        font-size: 13px;
        font-weight: 600;
    }

    .input-wrapper {
        position: relative;
    }

    input {
        width: 100%;
        height: 52px;
        padding: 0 15px;
        border-radius: 11px;
        border: 1px solid #252d3e;
        outline: none;
        background: rgba(5, 8, 15, .75);
        color: white;
        font-size: 14px;
        transition: .25s;
    }

    input::placeholder {
        color: #4f596d;
    }

    input:focus {
        border-color: rgba(108,99,255,.8);
        box-shadow: 0 0 0 4px rgba(108,99,255,.09);
    }

    #password {
        padding-right: 52px;
    }

    .password-toggle {
        position: absolute;
        top: 50%;
        right: 8px;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        border: 0;
        margin: 0;
        background: transparent;
        color: #68738a;
        cursor: pointer;
        border-radius: 8px;
        font-size: 15px;
    }

    .password-toggle:hover {
        background: rgba(255,255,255,.05);
        color: white;
    }

    /* Options */

    .options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 6px 0 24px;
    }

    .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
    }

    .remember input {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
    }

    .forgot {
        color: #969dff;
        font-size: 12px;
        text-decoration: none;
    }

    .forgot:hover {
        color: white;
    }

    /* Login button */

    .login-button {
        width: 100%;
        height: 53px;
        border: 0;
        border-radius: 11px;
        cursor: pointer;
        color: white;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: .2px;
        background: linear-gradient(
            110deg,
            var(--accent),
            #7c69ff,
            var(--accent2)
        );
        background-size: 200% 100%;
        box-shadow: 0 12px 30px rgba(108,99,255,.2);
        transition: .3s;
    }

    .login-button:hover {
        background-position: 100% 0;
        transform: translateY(-1px);
        box-shadow: 0 16px 35px rgba(108,99,255,.28);
    }

    .login-button:active {
        transform: translateY(1px);
    }

    .login-button.loading {
        pointer-events: none;
        opacity: .75;
    }

    /* Status */

    .status {
        min-height: 22px;
        margin-top: 15px;
        text-align: center;
        font-size: 12px;
    }

    .status.success {
        color: #58e6ad;
    }

    .status.error {
        color: var(--danger);
    }

    /* Security indicator */

    .security {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin-top: 25px;
        color: #626d82;
        font-size: 10px;
        letter-spacing: .5px;
    }

    .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #43dfa1;
        box-shadow: 0 0 10px #43dfa1;
    }

    .footer {
        text-align: center;
        margin-top: 20px;
        color: #414a5d;
        font-size: 10px;
    }

    /* Success screen */

    .success-screen {
        display: none;
        text-align: center;
        animation: appear .5s ease;
    }

    .success-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        background: rgba(67,223,161,.1);
        border: 1px solid rgba(67,223,161,.25);
        color: #43dfa1;
    }

    .success-screen h2 {
        font-size: 25px;
        margin-bottom: 9px;
    }

    .success-screen p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
    }

    .logout-button {
        margin-top: 25px;
        width: 100%;
        height: 48px;
        border: 1px solid #293247;
        border-radius: 10px;
        background: transparent;
        color: #c8cfdd;
        cursor: pointer;
    }

    .logout-button:hover {
        background: rgba(255,255,255,.04);
    }

    @media (max-width: 500px) {
        .login-card {
            padding: 30px 24px;
        }

        h1 {
            font-size: 27px;
        }
    }
</style>
</head>

<body>

<div class="grid"></div>
<div class="orb one"></div>
<div class="orb two"></div>

<main class="login-wrapper">

    <section class="login-card">

        <!-- LOGIN -->

        <div id="loginSection">

            <div class="brand">
                <div class="brand-icon">CEM</div>

                <div>
                    <div class="brand-name">CEM Cyber</div>
                    <div class="brand-sub">Security Portal</div>
                </div>
            </div>

            <h1>Welcome back.</h1>

            <p class="description">
                Sign in to access your secure cybersecurity workspace.
            </p>

            <form id="loginForm">

                <div class="field">

                    <div class="field-header">
                        <label for="username">Username</label>
                    </div>

                    <input
                        id="username"
                        type="text"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="field">

                    <div class="field-header">
                        <label for="password">Password</label>
                    </div>

                    <div class="input-wrapper">

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            ◉
                        </button>

                    </div>

                </div>

                <div class="options">

                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#" class="forgot"
                       onclick="forgotPassword(event)">
                        Forgot password?
                    </a>

                </div>

                <button class="login-button" id="loginButton" type="submit">
                    Sign in securely
                </button>

                <div class="status" id="status"></div>

            </form>

            <div class="security">
                <span class="dot"></span>
                Secure authentication service online
            </div>

            <div class="footer">
                © 2026 CEM Cyber · Authorized Access Only
            </div>

        </div>

        <!-- SUCCESS -->

        <div class="success-screen" id="successScreen">

            <div class="success-icon">
                ✓
            </div>

            <h2>Authentication successful</h2>

            <p>
                Welcome back, <strong id="welcomeUser"></strong>.
                <br>
                Your secure session has been established.
            </p>

            <button class="logout-button" onclick="logout()">
                Sign out
            </button>

        </div>

    </section>

</main>

<script>
    const VALID_USERNAME = "cemcyber";
    const VALID_PASSWORD = "CEMCYBER@26";

    const form = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const status = document.getElementById("status");
    const loginButton = document.getElementById("loginButton");

    const loginSection = document.getElementById("loginSection");
    const successScreen = document.getElementById("successScreen");
    const welcomeUser = document.getElementById("welcomeUser");

    const togglePassword =
        document.getElementById("togglePassword");

    /* Show / hide password */

    togglePassword.addEventListener("click", () => {

        if (password.type === "password") {
            password.type = "text";
            togglePassword.textContent = "◉";
            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );
        } else {
            password.type = "password";
            togglePassword.textContent = "◉";
            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );
        }

    });

    /* Login */

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const user = username.value.trim();
        const pass = password.value;

        status.className = "status";
        status.textContent = "";

        loginButton.classList.add("loading");
        loginButton.textContent = "Authenticating...";

        setTimeout(() => {

            if (
                user === VALID_USERNAME &&
                pass === VALID_PASSWORD
            ) {

                status.className = "status success";
                status.textContent =
                    "Credentials verified.";

                setTimeout(() => {

                    welcomeUser.textContent = user;

                    loginSection.style.display = "none";
                    successScreen.style.display = "block";

                }, 500);

            } else {

                status.className = "status error";
                status.textContent =
                    "Invalid username or password.";

                loginButton.classList.remove("loading");
                loginButton.textContent =
                    "Sign in securely";

            }

        }, 900);

    });

    /* Forgot password demo */

    function forgotPassword(event) {

        event.preventDefault();

        status.className = "status";
        status.textContent =
            "Please contact the system administrator.";

    }

    /* Logout */

    function logout() {

        successScreen.style.display = "none";
        loginSection.style.display = "block";

        username.value = "";
        password.value = "";

        status.className = "status";
        status.textContent = "";

        loginButton.classList.remove("loading");
        loginButton.textContent = "Sign in securely";

    }
</script>

</body>
</html>
